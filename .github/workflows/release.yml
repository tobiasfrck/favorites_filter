name: Browser Extension Release

on:
  workflow_dispatch:  # Allows manual triggering of the workflow from GitHub Actions UI
    inputs:
      branch:
        description: 'Select the branch to build from'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the tag and the release

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Read version from manifest
        id: manifest
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Build and validate browser packages
        run: npm run test:build

      - name: Zip Chrome extension
        working-directory: dist/chrome
        run: zip -r ../favorites_filter-chrome.zip .

      - name: Zip Firefox extension
        working-directory: dist/firefox
        run: zip -r ../favorites_filter-firefox.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/favorites_filter-chrome.zip
            dist/favorites_filter-firefox.zip
          fail_on_unmatched_files: true
          tag_name: v${{ steps.manifest.outputs.version }}
          target_commitish: ${{ steps.checkout.outputs.commit }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
